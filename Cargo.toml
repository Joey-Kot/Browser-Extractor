[workspace]
resolver = "2"
members = [
    "crates/extractor-cli",
    "crates/extractor-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/example/browser-extractor"
rust-version = "1.99.1"

[workspace.dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["macros", "ws"] }
clap = { version = "=4.6.4", features = ["derive", "env"] }
dashmap = "=6.2.1"
futures-util = "=0.3.33"
getrandom = "=0.4.3"
hex = "=0.4.3"
htmd = "=0.5.5"
indexmap = "=2.14.0"
rand = "=0.10.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
scraper = "=0.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["full"] }
toml = "=1.1.4"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["cors", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
